# This workflow can be run manually or on a user-configured schedule.
name: Update Calendar Everyday

env:
  USERNAME: ${{ secrets.USERNAME }}
  PASSWORD: ${{ secrets.PASSWORD }}

  ###### preferences 配置信息 ######

  # 在这里修改学期代码，用逗号分隔。
  # Set termcode here, separated by commas.
  # Example: 2502,2506
  TERM_CODES: "2502,2506"

  # 日程开始前多少分钟提醒
  # Reminder minutes before each timed event
  ALERT: "30"

  # zh_MO for Chinese, en_US for English
  LOCALE: "zh_MO"


on:
  workflow_dispatch:

  # Uncomment the following lines to enable scheduled runs.
  # schedule:
  #   - cron: '0 0 * * *'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.12.6
      uses: actions/setup-python@v3
      with:
        python-version: "3.12.6"

    - name: setup-chromedriver
      uses: nanasess/setup-chromedriver@v2.2.2

    - name: init driver
      run: |
        export DISPLAY=:99
        chromedriver --url-base=/wd/hub &
        sudo Xvfb -ac :99 -screen 0 1280x1024x24 > /dev/null 2>&1 & # optional

        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run tests
      run: |
        python -m unittest discover -s tests -v

    - name: Generate unified calendar
      run: |
        python ./main.py

    - name: Commit calendar changes
      run: |
        git config --global user.email calRobot@github.com
        git config --global user.name githubAction
        git add -f "output/${USERNAME}.ics"
        if ! git diff --cached --quiet; then
          git commit -m "update"
        fi

    - name: Push changes
      uses: ad-m/github-push-action@master
